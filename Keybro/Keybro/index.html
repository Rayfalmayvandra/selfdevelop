<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Casio Virtual Synth</title>
    <link rel="stylesheet" href="style.css?v=14">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer></script>
    <script src="script.js?v=14" defer></script>
</head>

<body>
    <div id="overlay" class="overlay">
        <div class="overlay-content">
            <h1>Vintage Casio Synth</h1>
            <p>Mellow, Lo-Fi, 90s Vibes</p>
            <button id="power-btn" class="power-btn">POWER ON / START PLAYING</button>
        </div>
    </div>

    <div class="piano-desk">
        <div class="music-stand">
            <div id="songbook" class="book-container">
                <!-- Left Page -->
                <div class="page left-page" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                    <h2>Rhythm Game Mode</h2>
                    <h3 id="current-patch-label">STEINWAY MODEL D</h3>
                    <p class="instruction" style="margin-top: 20px; font-size: 14px;">Select your instrument patch below, then pick a song from the right page to play along!</p>
                </div>
                
                <!-- Right Page -->
                <div class="page right-page" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
                    <p class="instruction" style="margin-top: 0; margin-bottom: 20px;">Available Songs:</p>

                    <div id="song-list" class="chords-list"
                        style="align-items: center; justify-content: center; flex-direction: column; gap: 20px; width: 100%;">
                        <!-- Populated by JS -->
                    </div>

                    <div id="score-display" class="hidden"
                        style="margin-top: 30px; font-size: 20px; color: #118ab2; font-family: 'Press Start 2P', cursive;">
                        Score: <span id="score-val">0</span></div>
                    <button id="stop-game-btn" class="power-btn hidden" style="margin-top: 30px;">STOP GAME</button>
                </div>
            </div>
        </div>

        <div class="synth-container">
            <div class="controls-bar">
                <div class="brand">CasioTone 90s</div>
                <div class="instrument-selector">
                    <label for="instrument">PATCH:</label>
                    <select id="instrument">
                        <option value="rhodes">FENDER RHODES</option>
                        <option value="steinway">STEINWAY MODEL D</option>
                    </select>
                </div>
                <button id="songbook-btn" class="songbook-btn">📖 SONGBOOK</button>
            </div>
            <div class="speakers">
                <div class="speaker-grill"></div>
                <div class="speaker-grill"></div>
            </div>

            <!-- Game Canvas for Falling Notes -->
            <canvas id="game-canvas" class="game-canvas" width="1188" height="200"></canvas>

            <div id="keyboard" class="keyboard">
                <!-- Lower Octave (C2 - B2) -->
                <button class="key white" data-note="C2" data-key="z"><span class="label">Z</span></button>
                <button class="key black cis" data-note="C#2" data-key="s"><span class="label">S</span></button>
                <button class="key white" data-note="D2" data-key="x"><span class="label">X</span></button>
                <button class="key black dis" data-note="D#2" data-key="d"><span class="label">D</span></button>
                <button class="key white" data-note="E2" data-key="c"><span class="label">C</span></button>
                <button class="key white" data-note="F2" data-key="v"><span class="label">V</span></button>
                <button class="key black fis" data-note="F#2" data-key="g"><span class="label">G</span></button>
                <button class="key white" data-note="G2" data-key="b"><span class="label">B</span></button>
                <button class="key black gis" data-note="G#2" data-key="h"><span class="label">H</span></button>
                <button class="key white" data-note="A2" data-key="n"><span class="label">N</span></button>
                <button class="key black ais" data-note="A#2" data-key="j"><span class="label">J</span></button>
                <button class="key white" data-note="B2" data-key="m"><span class="label">M</span></button>

                <!-- Middle Octave (C3 - B3) -->
                <button class="key white" data-note="C3" data-key="q"><span class="label">Q</span></button>
                <button class="key black cis2" data-note="C#3" data-key="2"><span class="label">2</span></button>
                <button class="key white" data-note="D3" data-key="w"><span class="label">W</span></button>
                <button class="key black dis2" data-note="D#3" data-key="3"><span class="label">3</span></button>
                <button class="key white" data-note="E3" data-key="e"><span class="label">E</span></button>
                <button class="key white" data-note="F3" data-key="r"><span class="label">R</span></button>
                <button class="key black fis2" data-note="F#3" data-key="5"><span class="label">5</span></button>
                <button class="key white" data-note="G3" data-key="t"><span class="label">T</span></button>
                <button class="key black gis2" data-note="G#3" data-key="6"><span class="label">6</span></button>
                <button class="key white" data-note="A3" data-key="y"><span class="label">Y</span></button>
                <button class="key black ais2" data-note="A#3" data-key="7"><span class="label">7</span></button>
                <button class="key white" data-note="B3" data-key="u"><span class="label">U</span></button>

                <button class="key white" data-note="C4" data-key="i"><span class="label">I</span></button>
                <button class="key black cis3" data-note="C#4" data-key="9"><span class="label">9</span></button>
                <button class="key white" data-note="D4" data-key="o"><span class="label">O</span></button>
                <button class="key black dis3" data-note="D#4" data-key="0"><span class="label">0</span></button>
                <button class="key white" data-note="E4" data-key="p"><span class="label">P</span></button>
                <button class="key white" data-note="F4" data-key="["><span class="label">[</span></button>
                <button class="key black fis3" data-note="F#4" data-key="="><span class="label">=</span></button>
                <button class="key white" data-note="G4" data-key="]"><span class="label">]</span></button>
                <button class="key black gis3" data-note="G#4" data-key="k"><span class="label">K</span></button>
                <button class="key white" data-note="A4" data-key="l"><span class="label">L</span></button>
                <button class="key black ais3" data-note="A#4" data-key=";"><span class="label">;</span></button>
                <button class="key white" data-note="B4" data-key="'"><span class="label">'</span></button>

                <button class="key white" data-note="C5" data-key="."><span class="label">.</span></button>
            </div>
        </div>
    </div>


</body>

</html>
